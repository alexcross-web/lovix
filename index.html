<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover растягивает сайт под челку и экраны 18:9 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Экзамка AI —  Генератор работ</title>
    <style>
        /* Жесткий сброс для мобильных WebView */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Блокируем прокрутку во время загрузки */
        body.loading {
            overflow: hidden !important;
            position: fixed;
        }

        * {
            box-sizing: border-box;
        }

        /* 1. АБСОЛЮТНЫЙ ПОЛНОЭКРАННЫЙ ПРЕЛОАДЕР */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            margin: 0 !important;
            padding: 0 !important;
        }

        .loader-container {
            text-align: center;
            max-width: 90%;
        }

        .spinner {
            width: 55px;
            height: 55px;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #38bdf8;
            border-right: 4px solid #818cf8;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e2e8f0;
        }
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loader-error {
            display: none;
            color: #ef4444;
            font-size: 1rem;
            margin-top: 10px;
        }
        .retry-btn {
            display: none;
            margin: 20px auto 0;
            background-color: #222531;
            color: #fff;
            border: 1px solid #3f445b;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 2. ПЛАШКА ИНТЕРНЕТА */
        #offline-toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            z-index: 100000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #offline-toast.show {
            top: 40px;
        }

        /* 3. ОСНОВНОЙ КОНТЕНТ */
        .main-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .content-visible {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            margin-bottom: 40px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.2rem;
            line-height: 1.2;
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 40px;
        }
        
        /* Кнопка с JS-событием */
        .cta-button {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.2s;
            width: 100%;
            max-width: 280px;
        }
        .cta-button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body class="loading"> <!-- Добавлен класс loading для фиксации -->

    <div id="offline-toast">⚠️ Отсутствует подключение к интернету</div>

    <!-- ОКНО ЗАГРУЗКИ -->
    <div id="loader-overlay">
        <div class="loader-container">
            <div id="loader-spinner" class="spinner"></div>
            <div id="loader-status-text" class="loader-text pulse">Инициализация AI ассистентов...</div>
            <div id="loader-error-msg" class="loader-error">⚠️ Пожалуйста, проверьте сеть.</div>
            <button id="retry-button" class="retry-btn" onclick="window.location.reload()">Повторить</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ САЙТА -->
    <div id="main-site-content" class="main-content">
        <header>
            <span class="badge">EXAMKA AI</span>
            <h1>САМЫЙ УМНЫЙ AI ДЛЯ СТУДЕНТОВ</h1>
            <p class="subtitle">Простой и мощный инструмент для создания качественных академических работ с помощью искусственного интеллекта.</p>
            
            <!-- КНОПКА С JS-ПЕРЕХОДОМ БЕЗ ССЫЛКИ -->
            <button class="cta-button" onclick="navigateToExamka()">Создать работу</button>
        </header>
    </div>

    <script>
        // Функция безопасного перехода внутри WebView
        function navigateToExamka() {
            window.location.href = "https://examka.ai";
        }

        document.addEventListener("DOMContentLoaded", function() {
            const loader = document.getElementById("loader-overlay");
            const spinner = document.getElementById("loader-spinner");
            const statusText = document.getElementById("loader-status-text");
            const errorMsg = document.getElementById("loader-error-msg");
            const retryBtn = document.getElementById("retry-button");
            const content = document.getElementById("main-site-content");
            const toast = document.getElementById("offline-toast");

            function startApp() {
                if (navigator.onLine) {
                    setTimeout(function() {
                        loader.classList.add("loader-hidden");
                        content.classList.add("content-visible");
                        document.body.classList.remove("loading"); // Разрешаем прокрутку контента
                    }, 3000);
                } else {
                    spinner.style.borderTopColor = "#ef4444";
                    spinner.style.borderRightColor = "#ef4444";
                    spinner.style.animation = "none"; 
                    statusText.textContent = "Нет сети";
                    statusText.classList.remove("pulse");
                    errorMsg.style.style.display = "block";
                    retryBtn.style.display = "block";
                }
            }

            startApp();

            window.addEventListener('offline', function() { toast.classList.add("show"); });
            window.addEventListener('online', function() {
                toast.classList.remove("show");
                if (!loader.classList.contains("loader-hidden")) {
                    window.location.reload();
                }
            });
        });
    </script>

</body>
</html>
